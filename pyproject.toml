[project]
name = "tiny-language-model"
version = "0.1.0"
description = "A tiny non-transformer byte-level language model."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "datasets>=3.0",
  "numpy>=1.26",
  "tokenizers>=0.20",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tlm*"]
